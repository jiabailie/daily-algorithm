name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4
    - name: Configure
      run: cmake -S . -B build
    - name: Build
      run: cmake --build build
    - name: Test
      run: |
        if [ -f build/CTestTestfile.cmake ]; then
          ctest --test-dir build --output-on-failure
        else
          echo "No CTest tests configured; skipping."
        fi
